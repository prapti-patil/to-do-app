<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <div class="todo-app">  <!-- Main app layout-->
        <h1>To-Do-App</h1>
        <div class="start-container">   <!-- Progress bar and count-->
            <div class="details">
                <h3>Keep it Up!</h3>
                <div id="progressbar">
                    <div id="progress"></div>
                 </div>
            </div>
           <div class="starts-number">
            <p id="numbers">0 / 0</p>
           </div>
        </div>
        <form class="input-area">   <!-- Add new tasks-->
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button type="submit" id="add-task-btn"><i class="fa-solid fa-plus"></i></button>
        </form>
        <div class="todos-container">   <!-- Show task list or empty image-->
            <ul id="task-list">
                <img class="empty-image" src="./images/image1.svg" alt="empty">
            </ul>
        </div>
     </div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
</body>
</html>
